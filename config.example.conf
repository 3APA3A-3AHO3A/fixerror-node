# Файл ответов для установки без вопросов:
#   sudo bash /tmp/setup.sh /root/node.conf
# Скопируйте, заполните, положите на сервер с правами 600 — внутри секреты.

# --- обязательное ---
PANEL_IP="203.0.113.10"           # IP панели: ей откроется порт ноды, с неё node-pull берёт сертификат и сайт
REMNA_SECRET=""                   # SECRET_KEY ноды из панели Remnawave
SERVER_LABEL="Finland 3 hshp"     # имя ноды в Telegram и в строке ключа на панели
SSH_PUBLIC_KEY="ssh-ed25519 AAAA... you@host"   # без него харденинг SSH отменяется
REMNANODE_VERSION=""              # версия образа ноды, например 3.4.3; пусто — latest

# --- роль ноды ---
NODE_ROLE="reality"               # reality — обычная нода; cdn — origin за CDN
STUB_NAMES="check.safeline24.com gateway.safeline24.com"   # имена сайта для self-steal (reality)
CDN_DOMAIN=""                     # для cdn: домен origin, например origin.safeline24.com
CDN_PATH="/api/v1/stream/"        # для cdn: путь XHTTP
CDN_XHTTP_PORT="4443"             # для cdn: порт XHTTP в Xray (127.0.0.1)

# --- панель (node-pull) ---
# Ключ сервера панели одной строкой: cat /etc/ssh/ssh_host_ed25519_key.pub на панели.
# Пусто — установщик спросит ключ у самой панели и напечатает отпечаток для сверки.
PANEL_HOSTKEY=""

# --- доступ ---
ADMIN_USER="vadim"                # учётка с sudo
SSH_PORT="8422"                   # порт SSH после харденинга
ADMIN_PASS=""                     # пусто = сгенерировать случайный
# Дополнительные ключи той же учётке, по одному на строку (необязательно):
SSH_EXTRA_KEYS=""

# --- учётка ИИ-агента (Claude и др. по MCP), необязательно ---
AGENT_USER="claude"
AGENT_SSH_KEYS=""                 # по одному ключу на строку; пусто — учётка не создаётся

# --- сеть ---
MTU_MODE="auto"                   # auto — замерить путь и закрепить, если меньше 1500; число — закрепить его; off — не трогать
UFW_EXTRA_PORTS=""                # дополнительно открыть, через пробел: "8443/tcp 8443/udp"

# --- выходы для Xray и дополнения ---
INSTALL_WARP="y"                  # Cloudflare WARP, SOCKS5 на 127.0.0.1:6000
INSTALL_WARP_NATIVE="y"           # warp-native: WARP интерфейсом warp; на нодах в РФ пропускается
INSTALL_PSIPHON="y"               # Psiphon: SOCKS5 на 1080
PSIPHON_REGION=""                 # страна выхода Psiphon (DE, PL…); пусто — страна сервера
INSTALL_SPEEDTEST="y"
GEODATA="y"                       # geo-базы Loyalsoldier + обновление раз в 3 дня

# --- Telegram (необязательно) ---
SETUP_TG="y"
TG_BOT_TOKEN=""
TG_CHAT_ID=""                     # супергруппа начинается с -100
TG_TOPIC_ID=""                    # пусто, если без топиков
TG_PROXY=""                       # ноды в РФ: socks5h://127.0.0.1:10808 (свой xray)
